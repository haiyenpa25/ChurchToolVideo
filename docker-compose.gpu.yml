version: '3.8'

services:
  churchtool-video:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churchtool_video_app
    restart: unless-stopped
    ports:
      - "${CHURCH_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./workspace/models:/root/.cache/huggingface
    environment:
      - WORKSPACE_DIR=/app/workspace
      - HF_HOME=/app/workspace/models
      - DEFAULT_WHISPER_MODEL=${DEFAULT_WHISPER_MODEL:-large-v3-turbo}
      - MAX_UPLOAD_SIZE_MB=4096
      - PYTHONUNBUFFERED=1
      - RENDER_WORKERS=${RENDER_WORKERS:-1}
      - TRIM_WORKERS=${TRIM_WORKERS:-2}
      - CHURCH_PASSWORD=${CHURCH_PASSWORD:-}
      - CHURCH_SESSION_SECRET=${CHURCH_SESSION_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_MODEL=${LLM_MODEL:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
