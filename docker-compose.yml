version: '3.8'

services:
  churchtool-video:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churchtool_video_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./workspace/models:/root/.cache/huggingface
    environment:
      - WORKSPACE_DIR=/app/workspace
      - HF_HOME=/app/workspace/models
      - DEFAULT_WHISPER_MODEL=base
      - MAX_UPLOAD_SIZE_MB=4096
      - PYTHONUNBUFFERED=1
    # Nếu dùng GPU trên Docker Desktop (WSL2), có thể mở khóa đoạn sau:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

